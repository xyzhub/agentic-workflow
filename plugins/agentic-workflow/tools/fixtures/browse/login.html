<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in — Fixture</title>
<style>body{font:16px system-ui;margin:40px}label{display:block;margin:8px 0}</style></head>
<body>
<main id="form">
  <h1>Sign in</h1>
  <form onsubmit="event.preventDefault();location.search='?done=1'">
    <label for="email">Email</label><input id="email" type="email" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <p><button type="submit">Sign in</button></p>
  </form>
</main>
<main id="done" hidden><h1>Dashboard</h1><p>Signed in as alice@demo.test. Welcome back.</p><a href="?">Sign out</a></main>
<script>
if (new URLSearchParams(location.search).get('done')) { document.getElementById('form').remove(); document.getElementById('done').hidden = false; }
</script>
</body></html>
