<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Swap — Fixture</title></head>
<body>
<!-- The password input is replaced by a plain text input 1 s after load, i.e.
     between the tool's snapshot and its act (the harness delays the Jev answer). -->
<label for="email">Email</label><input id="email" type="email">
<label for="pw">Password</label><input id="pw" type="password">
<button>Sign in</button>
<script>
setTimeout(() => { const n = document.createElement('input'); n.type = 'text'; n.id = 'pw'; document.getElementById('pw').replaceWith(n); }, 1000);
</script>
</body></html>
